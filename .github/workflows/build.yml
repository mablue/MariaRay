name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK setup (manual)
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CT=""
          for d in "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/15.0/bin" "$SDK/tools/bin"; do
            if [ -x "$d/sdkmanager" ]; then CT="$d"; break; fi
          done
          if [ -z "$CT" ]; then CT="$(dirname "$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)")"; fi
          echo "$CT" >> "$GITHUB_PATH"
          yes | "$CT/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CT/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -3 || true

      - name: Verify keystore
        run: |
          if [ ! -f app/mariaray.jks ]; then
            echo "ERROR: app/mariaray.jks missing."
            exit 1
          fi
          ls -la app/mariaray.jks

      - name: Download Xray-core (arm64-v8a)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v25.4.30/Xray-linux-arm64-v8a.zip
          unzip -oq /tmp/xray.zip -d /tmp/xray
          cp /tmp/xray/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          file app/src/main/jniLibs/arm64-v8a/libxray.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mariaray
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
